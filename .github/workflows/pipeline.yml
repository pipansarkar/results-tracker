name: results-pipeline

on:
  schedule:
    # GitHub cron is in UTC: 03:07-18:37 UTC = 08:37-00:07 IST, every 30 min.
    # Off the :00/:30 marks, where GitHub often delays or drops runs.
    - cron: "7,37 3-18 * * *"
    # 02:23 UTC = 07:53 IST: "concall today" / "results today" alerts.
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra args, e.g. --backfill or --refresh-universe"
        required: false
        default: ""

permissions:
  contents: read
  actions: write   # lets a run start the next one (see last step)

# Never run two pipelines at once (they share pipeline_state in Firestore).
concurrency:
  group: results-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Normal runs ~10 min; the one-off --backfill-all run can take hours.
    timeout-minutes: ${{ contains(github.event.inputs.args, '--backfill-all') && 350 || 55 }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Note start time
        run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Run pipeline
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Minutes per run spent loading history until every stock has it.
          BACKFILL_MINUTES: "25"
          # Concall summaries per run: up to 80 within 12 minutes.
          MAX_SUMMARIES: "80"
          SUMMARY_MINUTES: "12"
          EXTRA_ARGS: ${{ github.event.inputs.args }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && [[ "$EXTRA_ARGS" != *--dry-run* ]]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret not set yet; skipping run."
            exit 0
          fi
          if [ "${{ github.event.schedule }}" = "23 2 * * *" ]; then
            python run.py --morning
          else
            python run.py $EXTRA_ARGS
          fi

      # GitHub's cron scheduler is unreliable for new repos. If it hasn't
      # fired in the last 90 minutes, start the next run ourselves so the
      # pipeline never stops. Once cron works, this step does nothing.
      - name: Keep the pipeline running
        if: always() && !contains(github.event.inputs.args, '--dry-run') && !contains(github.event.inputs.args, '--symbols')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow results-pipeline --event schedule --limit 1 --json createdAt -q '.[0].createdAt // ""')
          now=$(date +%s)
          if [ -z "$last" ] || [ $(( now - $(date -d "$last" +%s) )) -gt 5400 ]; then
            # Space runs >= 25 min apart, so a short run (e.g. when the free
            # Firestore quota is used up) doesn't start runs back to back.
            wait=$(( 1500 - (now - ${RUN_START:-$now}) ))
            if [ "$wait" -gt 0 ]; then echo "Waiting ${wait}s before the next run."; sleep "$wait"; fi
            echo "Scheduler idle: starting next run."
            gh workflow run results-pipeline -R "$GITHUB_REPOSITORY"
          else
            echo "Scheduler active (last scheduled run $last)."
          fi
