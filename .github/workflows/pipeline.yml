name: results-pipeline

on:
  schedule:
    # GitHub cron is in UTC: 03:07-18:37 UTC = 08:37-00:07 IST, every 30 min.
    # Off the :00/:30 marks, where GitHub often delays or drops runs.
    - cron: "7,37 3-18 * * *"
    # 02:23 UTC = 07:53 IST: "concall today" / "results today" alerts.
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra args, e.g. --backfill or --refresh-universe"
        required: false
        default: ""

permissions:
  contents: read
  actions: write   # lets a run start the next one (see last step)

# Never run two pipelines at once (they share pipeline_state in Firestore).
concurrency:
  group: results-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Normal runs ~10 min; the one-off --backfill-all run can take hours.
    timeout-minutes: ${{ contains(github.event.inputs.args, '--backfill-all') && 350 || 75 }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Note start time
        run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Run pipeline
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Minutes per run spent loading history until every stock has it.
          BACKFILL_MINUTES: "25"
          # Concall summaries per run: up to 80 within 16 minutes.
          MAX_SUMMARIES: "80"
          SUMMARY_MINUTES: "16"
          EXTRA_ARGS: ${{ github.event.inputs.args }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && [[ "$EXTRA_ARGS" != *--dry-run* ]]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret not set yet; skipping run."
            exit 0
          fi
          if [ "${{ github.event.schedule }}" = "23 2 * * *" ]; then
            python run.py --morning
          else
            python run.py $EXTRA_ARGS
          fi

      # GitHub's cron scheduler is unreliable for new repos. If it hasn't
      # fired in the last 90 minutes, start the next run ourselves so the
      # pipeline never stops. Once cron works, this step does nothing.
      - name: Keep the pipeline running
        if: always() && !contains(github.event.inputs.args, '--dry-run') && !contains(github.event.inputs.args, '--symbols')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Start the next run unless one is already queued or running
          # (GitHub's cron often skips slots). Runs stay >= 25 min apart.
          others=$(gh run list -R "$GITHUB_REPOSITORY" --workflow results-pipeline --limit 10 \
                     --json databaseId,status -q "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\")] | length") || others=1
          if [ "${others:-0}" -gt 0 ]; then
            echo "Another run is already queued; not starting one."
            exit 0
          fi
          now=$(date +%s)
          wait=$(( 1500 - (now - ${RUN_START:-$now}) ))
          if [ "$wait" -gt 0 ]; then echo "Waiting ${wait}s before the next run."; sleep "$wait"; fi
          echo "Starting next run."
          # Retry brief GitHub API errors; never fail the run over this step
          # (the cron schedule starts the next run anyway).
          for i in 1 2 3; do
            gh workflow run results-pipeline -R "$GITHUB_REPOSITORY" && exit 0
            sleep 30
          done
          echo "::warning::Could not start the next run; the schedule will start one."
