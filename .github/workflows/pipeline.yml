name: results-pipeline

on:
  schedule:
    # GitHub cron is in UTC. 03:00-18:30 UTC = 08:30-00:00 IST, every 30 min.
    - cron: "*/30 3-18 * * *"
    # 02:30 UTC = 08:00 IST: "concall today" / "results today" alerts.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra args, e.g. --backfill or --refresh-universe"
        required: false
        default: ""

# Never run two pipelines at once (they share pipeline_state in Firestore).
concurrency:
  group: results-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Run pipeline
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Stocks whose 3-year history is loaded per run (~13 s each).
          BACKFILL_PER_RUN: "40"
          EXTRA_ARGS: ${{ github.event.inputs.args }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && [[ "$EXTRA_ARGS" != *--dry-run* ]]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret not set yet; skipping run."
            exit 0
          fi
          if [ "${{ github.event.schedule }}" = "30 2 * * *" ]; then
            python run.py --morning
          else
            python run.py $EXTRA_ARGS
          fi
